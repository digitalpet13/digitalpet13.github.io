<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Pet Marketplace</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <main class="login-page">

    <div class="login-card">

      <img
        src="./page-logo.png"
        alt="Digital Pet Marketplace"
        class="login-logo"
      >

      <h1>Digital Pet</h1>

      <p class="login-subtitle">
        Marketplace
      </p>

      <p class="login-description">
        Collect • Battle • Breed • Trade
      </p>

      <button
        class="pi-login"
        onclick="signInWithPi()"
      >

        <span class="pi-symbol">π</span>

        <span>
          Sign in with Pi
        </span>

      </button>

      <p class="login-note">
        Pi Sandbox • Test Environment
      </p>

      <p class="security-note">
        🔐 No passphrase requested
      </p>

    </div>

  </main>


  <script>

    function signInWithPi() {

      /*
       * Pi Sandbox authentication will be connected here.
       *
       * After successful authentication:
       *
       * window.location.href = "marketplace.html";
       */

      alert(
        "🟣 Pi Sandbox\n\n" +
        "Pi authentication will be connected here " +
        "using the Pi SDK."
      );

    }

  </script>

</body>
</html>
